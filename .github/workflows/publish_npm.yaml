name: publish_npm

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: Version to publish. Accepts v-prefixed tags, for example v0.1.0.
        required: true
        type: string

permissions:
  contents: read
  id-token: write
  attestations: write

concurrency:
  group: ${{ github.workflow }}

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve package version
        id: version
        env:
          RAW_VERSION: ${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}
        run: |-
          version="${RAW_VERSION#v}"
          echo "package_version=$version" >> "$GITHUB_OUTPUT"

      - name: Use Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: Activate Yarn
        run: |-
          corepack enable
          corepack prepare yarn@4.13.0 --activate

      - name: Restore Yarn cache
        uses: actions/cache@v4
        with:
          path: |
            .yarn/cache
            .yarn/install-state.gz
          key: ${{ runner.os }}-yarn-4.13.0-${{ hashFiles('yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-yarn-4.13.0-

      - name: Install dependencies
        run: yarn install --immutable

      - name: Build bundle
        run: yarn build

      - name: Run tests
        run: yarn test --runInBand

      - name: Prepare npm package
        env:
          PACKAGE_VERSION: ${{ steps.version.outputs.package_version }}
          NPM_PACKAGE_NAME: lorebook-tool-call
        run: node .github/scripts/prepare-wtc-npm-package.mjs

      - name: Pack npm tarball
        run: |-
          mkdir -p npm-dist
          npm pack ./dist/wtc --pack-destination ./npm-dist

      - name: Upload npm artifact
        uses: actions/upload-artifact@v4
        with:
          name: npm-package
          path: npm-dist/*.tgz
          if-no-files-found: error
          retention-days: 14

      - name: Generate artifact attestation
        uses: actions/attest-build-provenance@v3
        with:
          subject-path: npm-dist/*.tgz

      - name: Publish to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish ./dist/wtc --provenance

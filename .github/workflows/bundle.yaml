name: bundle

on:
  push:
    branches:
      - master
      - main
      - develop
    paths-ignore:
      - dist/**
  workflow_dispatch:

permissions:
  actions: read
  contents: write
  id-token: write
  attestations: write

concurrency:
  group: ${{ github.workflow }}

jobs:
  bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: JesseTG/rm@v1.0.3
        with:
          path: dist

      - name: Use Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Activate Yarn
        run: |-
          corepack enable
          corepack prepare yarn@4.13.0 --activate
      - name: Restore Yarn cache
        uses: actions/cache@v4
        with:
          path: |
            .yarn/cache
            .yarn/install-state.gz
          key: ${{ runner.os }}-yarn-4.13.0-${{ hashFiles('yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-yarn-4.13.0-
      - name: Install dependencies
        run: yarn install --immutable
      - name: Build bundle
        run: yarn build
      - name: Run tests
        run: yarn test --runInBand
      - name: Only keep 角色卡示例 in dist for template upstream
        if: github.repository == 'StageDog/tavern_helper_template'
        run: |
          mv dist/角色卡示例 角色卡示例
          rm -rf dist
          mkdir dist
          mv 角色卡示例 dist/
      - name: Remove 示例 in dist for templated repository
        if: github.repository != 'StageDog/tavern_helper_template'
        run: |
          rm -rf dist/角色卡示例 dist/脚本示例 dist/流式楼层界面示例 dist/前端界面示例
      - name: Package dist/wtc artifact
        run: |-
          mkdir -p artifacts
          tar -czf artifacts/wtc-dist.tgz -C dist wtc
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: wtc-dist
          path: artifacts/wtc-dist.tgz
          if-no-files-found: error
          retention-days: 14
      - name: Generate artifact attestation
        uses: actions/attest-build-provenance@v3
        with:
          subject-path: artifacts/wtc-dist.tgz
      - name: Commit changes
        uses: EndBug/add-and-commit@v9.1.3
        with:
          default_author: github_actions
          message: '[bot] bundle'

      # 自动打版本 tag, 从而让 jsdelivr 基于版本号在 12h 内更新缓存而不是用非版本号的 7d 缓存
      - id: autotag
        if: github.repository != 'StageDog/tavern_helper_template'
        uses: phish108/autotag-action@v1.1.64
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          with-v: true
          release-branch: master,main,develop
      - if: ${{ github.repository != 'StageDog/tavern_helper_template' && steps.autotag.outputs.tag != '0.0.0' && steps.autotag.outputs.new-tag != steps.autotag.outputs.tag }}
        run: git push --delete origin ${{ steps.autotag.outputs.tag }}
